<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="repoHeroTitle repoHeroDesc">
  <title id="repoHeroTitle">Kenyon Auto Cosmetics — Dynamic 23-ZIP Pricing Engine, State-Coupled Concierge &amp; Executive Dispatch BI</title>
  <desc id="repoHeroDesc">Client production full-stack architecture unifying Studio, Mobile Rig, Academy, and B2B Fleet dispatch onto a zero-cost Google Sheets serverless backend.</desc>

  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.40; }
      }
      @keyframes ringBreath {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 0.08; }
      }
      @keyframes coachworkGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.70; }
      }
      .pulse-dot { animation: statusPulse 2.6s ease-in-out infinite; }
      .pulse-ring { animation: ringBreath 2.6s ease-in-out infinite; }
      .ambient-sheen { animation: coachworkGlow 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>

    <clipPath id="repoHeroClip">
      <rect x="0.5" y="0.5" width="1199" height="339" rx="14"/>
    </clipPath>

    <linearGradient id="coachworkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="52%" stop-color="#1A1518"/>
      <stop offset="100%" stop-color="#261B14"/>
    </linearGradient>

    <linearGradient id="repoTopAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C89B6E"/>
      <stop offset="38%" stop-color="#8C5A32"/>
      <stop offset="72%" stop-color="#5B8CC0"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="warmBronzeGlow" cx="80%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#C89B6E" stop-opacity="0.19"/>
      <stop offset="55%" stop-color="#8C5A32" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="navyDepthGlow" cx="15%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#5B8CC0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bronzeRuleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C89B6E" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#4A3525" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4A3525" stop-opacity="0"/>
    </linearGradient>

    <pattern id="coachworkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4A3525" stroke-width="0.7" stroke-opacity="0.34"/>
      <circle cx="0" cy="0" r="1" fill="#C89B6E" fill-opacity="0.20"/>
    </pattern>

    <radialGradient id="repoGridMaskGrad" cx="52%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </radialGradient>

    <mask id="repoGridMask">
      <rect x="0" y="0" width="1200" height="340" fill="url(#repoGridMaskGrad)"/>
    </mask>
  </defs>

  <!-- Clipped Canvas Layer -->
  <g clip-path="url(#repoHeroClip)">
    <rect x="0" y="0" width="1200" height="340" fill="url(#coachworkBg)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#coachworkGrid)" mask="url(#repoGridMask)"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#warmBronzeGlow)" class="ambient-sheen"/>
    <rect x="0" y="0" width="1200" height="340" fill="url(#navyDepthGlow)"/>

    <!-- Top 2.5px Accent Bar -->
    <rect x="0.5" y="0.5" width="1199" height="2.5" fill="url(#repoTopAccent)"/>
  </g>

  <!-- Crisp Outer Border (#4A3525 Burnished Bronze) -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#4A3525" stroke-width="1"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="13" fill="none" stroke="#C89B6E" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN (x="60") ==================== -->

  <!-- Eyebrow Status Pill -->
  <g>
    <rect x="60" y="42" width="510" height="30" rx="15" fill="#261B14" stroke="#4A3525" stroke-width="1"/>
    <circle cx="79" cy="57" r="6.5" fill="#3D8B6E" class="pulse-ring"/>
    <circle cx="79" cy="57" r="3.6" fill="#3D8B6E" class="pulse-dot"/>
    <text x="93" y="60.8" class="mono" font-size="10" font-weight="600" letter-spacing="0.4" fill="#C89B6E">CLIENT PRODUCTION SYSTEM  <tspan fill="#57B894">•  ZERO-BUILD FULL-STACK ARCHITECTURE</tspan></text>
  </g>

  <!-- Title -->
  <text x="60" y="122" class="sans" font-size="44" font-weight="800" letter-spacing="-0.6" fill="#F1F5F9">KENYON AUTO COSMETICS</text>

  <!-- Subtitle -->
  <text x="60" y="157" class="sans" font-size="18" font-weight="600" letter-spacing="-0.25" fill="#C89B6E">Dynamic 23-ZIP Pricing Engine, State-Coupled Concierge &amp; Executive Dispatch BI</text>

  <!-- Subtle Coachwork Accent Hairline -->
  <rect x="60" y="175" width="380" height="1" fill="url(#bronzeRuleFade)"/>

  <!-- 2-Line Executive Summary -->
  <text x="60" y="203" class="sans" font-size="14.5" font-weight="400" fill="#CBD5E1">Eliminates manual mobile detailing fee quotes across Greater Phoenix while unifying Studio,</text>
  <text x="60" y="227" class="sans" font-size="14.5" font-weight="400" fill="#CBD5E1">Mobile Rig, Academy, and B2B Fleet dispatch onto a $0/mo Google Sheets serverless backend.</text>

  <!-- 3 Spec Pills (y="272", height="32", rx="7") -->
  <!-- Spec Pill 1 -->
  <g>
    <rect x="60" y="272" width="204" height="32" rx="7" fill="#261B14" stroke="#4A3525" stroke-width="1"/>
    <circle cx="77" cy="288" r="3.2" fill="#C89B6E"/>
    <text x="89" y="292.2" class="sans" font-size="12.2" font-weight="600" fill="#C89B6E">23-ZIP Distance Math</text>
  </g>

  <!-- Spec Pill 2 -->
  <g>
    <rect x="276" y="272" width="248" height="32" rx="7" fill="#131E32" stroke="#1E2F4D" stroke-width="1"/>
    <circle cx="293" cy="288" r="3.2" fill="#6E96C4"/>
    <text x="305" y="292.2" class="sans" font-size="12.2" font-weight="600" fill="#6E96C4">State-Coupled AI Concierge</text>
  </g>

  <!-- Spec Pill 3 -->
  <g>
    <rect x="536" y="272" width="212" height="32" rx="7" fill="#131E32" stroke="#1E2F4D" stroke-width="1"/>
    <circle cx="553" cy="288" r="3.2" fill="#57B894"/>
    <text x="565" y="292.2" class="sans" font-size="12.2" font-weight="600" fill="#57B894">Chart.js Executive BI</text>
  </g>

  <!-- ==================== RIGHT COLUMN: EXECUTIVE DASHBOARD CARD ==================== -->
  <g>
    <!-- Card Container (x="790" y="42" width="356" height="256" rx="10") -->
    <rect x="790" y="42" width="356" height="256" rx="10" fill="#0D1526" stroke="#4A3525" stroke-width="1"/>
    <line x1="790" y1="72" x2="1146" y2="72" stroke="#4A3525" stroke-width="1"/>

    <!-- Window Control Dots -->
    <circle cx="808" cy="57" r="3.8" fill="#8C5A32"/>
    <circle cx="821" cy="57" r="3.8" fill="#C89B6E"/>
    <circle cx="834" cy="57" r="3.8" fill="#3D8B6E"/>

    <!-- Card Header -->
    <text x="848" y="60.5" class="mono" font-size="9.3" font-weight="700" letter-spacing="0.45" fill="#C89B6E">PHOENIX STUDIO + MOBILE RIGS</text>
    <circle cx="1101" cy="57" r="2.8" fill="#3D8B6E" class="pulse-dot"/>
    <text x="1132" y="60.5" text-anchor="end" class="mono" font-size="8.6" font-weight="700" fill="#57B894">LIVE</text>

    <!-- 2x2 Mini KPI Grid -->
    <!-- KPI 1: $129.2K 3-Mo Volume -->
    <rect x="804" y="82" width="158" height="48" rx="6" fill="#261B14" stroke="#4A3525" stroke-width="0.8"/>
    <text x="816" y="103" class="sans" font-size="16" font-weight="800" fill="#F1F5F9">$129.2K</text>
    <text x="816" y="120" class="mono" font-size="9.4" font-weight="600" fill="#C89B6E">3-Mo Volume</text>

    <!-- KPI 2: 62/38% Split -->
    <rect x="974" y="82" width="158" height="48" rx="6" fill="#131E32" stroke="#1E2F4D" stroke-width="0.8"/>
    <text x="986" y="103" class="sans" font-size="16" font-weight="800" fill="#F1F5F9">62/38%</text>
    <text x="986" y="120" class="mono" font-size="9.4" font-weight="600" fill="#6E96C4">Studio / Rig Split</text>

    <!-- KPI 3: $6,535 ZIP Fees Recovered -->
    <rect x="804" y="138" width="158" height="48" rx="6" fill="#261B14" stroke="#4A3525" stroke-width="0.8"/>
    <text x="816" y="159" class="sans" font-size="16" font-weight="800" fill="#F1F5F9">$6,535</text>
    <text x="816" y="176" class="mono" font-size="9.4" font-weight="600" fill="#C89B6E">ZIP Fees Recovered</text>

    <!-- KPI 4: $0/mo Serverless Sync -->
    <rect x="974" y="138" width="158" height="48" rx="6" fill="#131E32" stroke="#1E2F4D" stroke-width="0.8"/>
    <text x="986" y="159" class="sans" font-size="16" font-weight="800" fill="#57B894">$0/mo</text>
    <text x="986" y="176" class="mono" font-size="9.4" font-weight="600" fill="#94A3B8">Serverless Sync</text>

    <!-- Mini Grouped Revenue Bars Sub-Card -->
    <rect x="804" y="195" width="328" height="91" rx="6" fill="#131E32" fill-opacity="0.78" stroke="#1E2F4D" stroke-width="0.8"/>
    <text x="816" y="211.5" class="mono" font-size="8.6" font-weight="700" letter-spacing="0.4" fill="#CBD5E1">CHANNEL REVENUE</text>

    <!-- Mini Legend -->
    <rect x="960" y="205" width="6" height="6" rx="1.5" fill="#C89B6E"/>
    <text x="969" y="211" class="mono" font-size="7.8" font-weight="600" fill="#94A3B8">STUDIO</text>
    <rect x="1014" y="205" width="6" height="6" rx="1.5" fill="#5B8CC0"/>
    <text x="1023" y="211" class="mono" font-size="7.8" font-weight="600" fill="#94A3B8">RIG</text>
    <rect x="1054" y="205" width="6" height="6" rx="1.5" fill="#3D8B6E"/>
    <text x="1063" y="211" class="mono" font-size="7.8" font-weight="600" fill="#94A3B8">FLEET</text>

    <!-- Chart Gridlines -->
    <line x1="816" y1="243" x2="1120" y2="243" stroke="#1E2F4D" stroke-width="0.7" stroke-dasharray="2 3"/>
    <line x1="816" y1="268" x2="1120" y2="268" stroke="#1E2F4D" stroke-width="0.9"/>

    <!-- Grouped Bars: Month 1 (AUG) -->
    <rect x="830" y="240" width="12" height="28" rx="1.5" fill="#C89B6E"/>
    <rect x="844" y="248" width="12" height="20" rx="1.5" fill="#5B8CC0"/>
    <rect x="858" y="255" width="12" height="13" rx="1.5" fill="#3D8B6E"/>
    <text x="850" y="280" text-anchor="middle" class="mono" font-size="7.8" font-weight="600" fill="#94A3B8">AUG</text>

    <!-- Grouped Bars: Month 2 (SEP) -->
    <rect x="904" y="234" width="12" height="34" rx="1.5" fill="#C89B6E"/>
    <rect x="918" y="243" width="12" height="25" rx="1.5" fill="#5B8CC0"/>
    <rect x="932" y="251" width="12" height="17" rx="1.5" fill="#3D8B6E"/>
    <text x="924" y="280" text-anchor="middle" class="mono" font-size="7.8" font-weight="600" fill="#94A3B8">SEP</text>

    <!-- Grouped Bars: Month 3 (OCT) -->
    <rect x="978" y="226" width="12" height="42" rx="1.5" fill="#C89B6E"/>
    <rect x="992" y="237" width="12" height="31" rx="1.5" fill="#5B8CC0"/>
    <rect x="1006" y="247" width="12" height="21" rx="1.5" fill="#3D8B6E"/>
    <text x="998" y="280" text-anchor="middle" class="mono" font-size="7.8" font-weight="600" fill="#94A3B8">OCT</text>

    <!-- Grouped Bars: Run-Rate / Q4 -->
    <rect x="1052" y="221" width="12" height="47" rx="1.5" fill="#C89B6E"/>
    <rect x="1066" y="233" width="12" height="35" rx="1.5" fill="#5B8CC0"/>
    <rect x="1080" y="243" width="12" height="25" rx="1.5" fill="#3D8B6E"/>
    <text x="1072" y="280" text-anchor="middle" class="mono" font-size="7.8" font-weight="600" fill="#57B894">Q4-RR</text>
  </g>
</svg>
